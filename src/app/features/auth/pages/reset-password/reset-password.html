<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand-mark">P</div>

    @if (done()) {
      <h1>¡Listo!</h1>
      <p class="auth-sub">Tu contraseña quedó actualizada. Te llevamos a iniciar sesión…</p>
    } @else {
      <h1>Crea una contraseña nueva</h1>

      @if (!token) {
        <div class="auth-error">
          Este enlace no es válido. <a routerLink="/olvide-mi-clave">Solicita uno nuevo</a>.
        </div>
      } @else {
        @if (errorMessage(); as msg) {
          <div class="auth-error">{{ msg }}</div>
        }

        <label class="field">
          <span>Contraseña nueva</span>
          <input
            type="password"
            placeholder="Mínimo 8 caracteres"
            [ngModel]="newPassword()"
            (ngModelChange)="newPassword.set($event)"
            name="newPassword"
            autocomplete="new-password"
          />
        </label>

        <label class="field">
          <span>Confírmala</span>
          <input
            type="password"
            placeholder="Escríbela de nuevo"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            name="confirmPassword"
            autocomplete="new-password"
          />
        </label>

        <button type="button" class="auth-submit" [disabled]="loading()" (click)="submit()">
          {{ loading() ? 'Guardando…' : 'Guardar contraseña' }}
        </button>
      }

      <p class="auth-switch"><a routerLink="/login">← Volver a entrar</a></p>
    }
  </div>
</div>
