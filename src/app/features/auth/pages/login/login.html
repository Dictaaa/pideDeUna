<div class="auth-page">
  <form class="auth-card" (ngSubmit)="submit()" *ngIf="!memberships()">
    <div class="auth-brand-mark">P</div>
    <h1>Entrar a tu panel</h1>
    <p class="auth-sub">Administra el menú y la operación de tu restaurante.</p>

    @if (errorMessage(); as msg) {
      <div class="auth-error">{{ msg }}</div>
    }

    <label class="field">
      <span>Email</span>
      <input
        type="email"
        placeholder="admin@turestaurante.co"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        autocomplete="username"
      />
    </label>

    <label class="field">
      <span>Contraseña</span>
      <input
        type="password"
        placeholder="••••••••"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
        autocomplete="current-password"
      />
    </label>

    <button type="submit" class="auth-submit" [disabled]="loading()">
      {{ loading() ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="auth-switch"><a routerLink="/olvide-mi-clave">¿Olvidaste tu contraseña?</a></p>
  </form>

  <!-- Solo aparece si el usuario tiene roles en más de una sucursal -->
  <div class="auth-card" *ngIf="memberships() as list">
    <h1>¿Con cuál sucursal quieres entrar?</h1>
    @if (errorMessage(); as msg) {
      <div class="auth-error">{{ msg }}</div>
    }
    <button
      type="button"
      class="auth-switch-item"
      *ngFor="let m of list"
      [disabled]="loading()"
      (click)="selectRestaurant(m.restaurantId)"
    >
      {{ m.restaurantName ?? 'Toda la compañía' }} — {{ m.roleCode }}
    </button>
  </div>
</div>
