<div class="shell">
  <app-navbar
    [companySlug]="companySlug"
    [branchSlug]="restaurant()?.slug ?? null"
    [restaurantName]="company()?.name ?? ''"
    [restaurantLogoUrl]="company()?.logoUrl ?? null"
    (toggleSidebar)="toggleSidebar()"
  ></app-navbar>

  <div class="shell-body">
    <app-sidebar
      [companySlug]="companySlug"
      [branchSlug]="restaurant()?.slug ?? null"
      [isOpen]="sidebarOpen()"
    ></app-sidebar>

    <main class="shell-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
