<aside class="sidebar" [class.closed]="!isOpen()">
  <nav class="nav-list">
    @for (item of items(); track item.label) {
      <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" (click)="itemSelected.emit()">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  @if (menuUrl(); as url) {
    <a class="nav-item nav-item-menu" [href]="url" target="_blank" rel="noopener">
      <span class="nav-icon">👁️</span>
      <span class="nav-label">Ver menú</span>
    </a>
  }
</aside>
